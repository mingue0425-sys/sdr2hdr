name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Verification script syntax and cache regressions
        run: |
          bash -n RUN_MACOS_VERIFY.sh
          bash -n Tests/generate_tiny_media_fixture.sh
          bash -n Tests/verify_tiny_media_fixture.sh
          bash -n Tests/generate_tiny_p010_fixture.sh
          bash -n Tests/verify_tiny_p010_fixture.sh
          bash -n Tests/RealMediaRegression/generate_regression_fixtures.sh
          bash -n Tests/RealMediaRegression/verify_regression_fixtures.sh
          bash -n Tests/verify_script_cache_test.sh
          bash Tests/verify_script_cache_test.sh
          python3 Tests/verify_no_frozen_access.py \
            --scope config/pre-frozen-seal-scope.json
          python3 Tests/verify_no_frozen_access_test.py
          python3 Tests/test_inventory_development_corpus.py
          python3 Tests/test_live31_source_provenance.py
          python3 Tests/verify_live31_regeneration.py
          python3 Tests/verify_preregistration_v2.py
          python3 -m json.tool Tests/RealMediaRegression/manifest.json >/dev/null
          python3 -m json.tool Tests/RealMediaRegression/gates.json >/dev/null
          python3 -m json.tool data_video/real_media/external-manifest.json >/dev/null
          python3 -m json.tool config/pre-frozen-seal-scope.json >/dev/null
          python3 -m json.tool results/development-corpus-inventory-scope.json >/dev/null
          python3 -m json.tool results/development-corpus-inventory.json >/dev/null
          python3 -m json.tool results/live31-source-provenance-recovery.json >/dev/null
          python3 -m json.tool config/live31-source-authority-index.json >/dev/null
          python3 -m json.tool results/frozen-protocol-incident.json >/dev/null
      - name: Check self-contained media tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Self-contained real-media integration
        run: ./RUN_MACOS_VERIFY.sh self-contained
      - name: Automatic source precision real-media integration
        run: ./RUN_MACOS_VERIFY.sh automatic-decode
      - name: Manifest-driven compressed-media regression matrix
        run: ./RUN_MACOS_VERIFY.sh regression
      - name: Metal runner diagnostics
        run: |
          sw_vers
          uname -a
          uname -m
          system_profiler SPDisplaysDataType || true
          sysctl hw.memsize hw.ncpu || true
      - name: Mandatory portable real-media multi-flight regression
        env:
          MTL_DEBUG_LAYER: 1
        run: ./RUN_MACOS_VERIFY.sh multiflight
      - name: VMAPPLE multi-flight diagnostic matrix
        if: always()
        run: ./RUN_MACOS_VERIFY.sh multiflight-diagnostic
      - name: Upload VMAPPLE multi-flight diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiflight-vmapple-diagnostic
          if-no-files-found: warn
          path: |
            results/multiflight-vmapple-diagnostic.json
            results/multiflight-vmapple-diagnostic/
      - name: VMAPPLE pure Metal and completion-handler isolation
        if: always()
        run: ./RUN_MACOS_VERIFY.sh pure-metal-multiflight
      - name: Upload VMAPPLE pure Metal multi-flight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmapple-pure-metal-multiflight
          if-no-files-found: warn
          path: |
            results/vmapple-pure-metal-multiflight.json
            results/vmapple-pure-metal-multiflight/
      - name: VMAPPLE HDR production stages and observer controls
        if: always()
        run: ./RUN_MACOS_VERIFY.sh hdr-stage-isolation
      - name: Upload VMAPPLE HDR stage isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmapple-hdr-stage-isolation
          if-no-files-found: warn
          path: |
            results/vmapple-hdr-stage-isolation.json
            results/vmapple-hdr-stage-isolation/
      - name: Swift tests
        run: swift test -c debug --disable-index-store --skip HDRMetalReferenceTests --skip HDRV6ToneCurveTests/testV6MetalOutputMatchesScalarReference --skip HDRV62SceneAdaptiveTests/testV62MetalOutputMatchesCPUReference --skip CalibrationTests/testV4RuntimeBenchmarkCollectsRealGPUAndCPUSamples

      - name: Release build and tests
        run: |
          swift build -c release --disable-index-store
          swift test -c release --disable-index-store

      - name: V4 runtime Metal benchmark
        run: swift test -c debug --disable-index-store --filter CalibrationTests/testV4RuntimeBenchmarkCollectsRealGPUAndCPUSamples

      - name: V6.2 Metal CPU parity test
        run: swift test -c debug --disable-index-store --filter HDRV62SceneAdaptiveTests/testV62MetalOutputMatchesCPUReference

      - name: V6 Metal CPU parity test
        run: swift test -c debug --disable-index-store --filter HDRV6ToneCurveTests/testV6MetalOutputMatchesScalarReference

      - name: BGRA zero-copy Metal test
        run: swift test -c debug --disable-index-store --filter HDRMetalReferenceTests/testBGRAFallbackUsesZeroCopyTexturePathAndMatchesReference

      - name: Remaining Metal reference tests
        run: swift test -c debug --disable-index-store --filter HDRMetalReferenceTests --skip HDRMetalReferenceTests/testBGRAFallbackUsesZeroCopyTexturePathAndMatchesReference

      - name: Independent Stage B re-audit
        env:
          MTL_DEBUG_LAYER: 1
        run: python3 Tests/independent_stage_b_reaudit.py
